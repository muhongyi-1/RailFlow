spring.application.name=RailFlow
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8011}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3307/railflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=${MYSQL_USER:railflow}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.sql.init.mode=never
spring.data.redis.url=${REDIS_URL:redis://127.0.0.1:6379/0}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
spring.data.redis.repositories.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.swagger-ui.path=/docs
railflow.redis.enabled=${RAILFLOW_REDIS_ENABLED:true}
railflow.worker.enabled=${RAILFLOW_WORKER_ENABLED:false}
railflow.scheduler.enabled=${RAILFLOW_SCHEDULER_ENABLED:false}
railflow.payment.secret=${RAILFLOW_PAYMENT_CALLBACK_SECRET:}
railflow.payment.legacy-enabled=${RAILFLOW_ENABLE_LEGACY_PAYMENT_API:false}
railflow.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
railflow.rabbitmq.port=${RABBITMQ_PORT:5672}
railflow.rabbitmq.username=${RABBITMQ_USER:railflow}
railflow.rabbitmq.password=${RABBITMQ_PASSWORD:}
