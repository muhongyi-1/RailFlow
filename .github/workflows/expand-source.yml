name: Publish RailFlow source
on:
  push:
    paths:
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely extract reviewed project files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          archive = Path("release/railflow.tar.xz")
          with tarfile.open(archive, mode="r:xz") as pack:
              members = pack.getmembers()
              for item in members:
                  path = Path(item.name)
                  if path.is_absolute() or ".." in path.parts or not item.isfile():
                      raise RuntimeError("Unsafe or unexpected archive entry: " + item.name)
                  if path.name == ".env":
                      raise RuntimeError("Private configuration cannot be published")
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with pack.extractfile(item) as source:
                      path.write_bytes(source.read())
          archive.unlink()
          Path('release/retry-trigger.txt').unlink(missing_ok=True)
          archive.parent.rmdir()
          Path('.github/workflows/tests.yml').unlink(missing_ok=True)
          print(f"Extracted {len(members)} project files")
          PY
      - name: Commit and push source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Publish cleaned RailFlow application and tests"
            git push origin HEAD:main
          fi
