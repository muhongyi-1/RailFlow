name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Run SQLite/in-memory unit tests
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          RAILFLOW_PAYMENT_CALLBACK_SECRET: test_only_secret
        run: python -m pytest -q
